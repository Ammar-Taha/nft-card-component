<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nft-card-component/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/nft-card-component/assets/favicon-32x32-DQjEQYWa.png"
    />
    <title>NFT Preview Card</title>
    <script type="module" crossorigin src="/nft-card-component/assets/index-BqfCrl5B.js"></script>
    <link rel="stylesheet" crossorigin href="/nft-card-component/assets/index-BJ1LGUwO.css">
  </head>
  <body>
    <main class="card flex-col-md">
      <figure class="card__image">
        <img
          src="/nft-card-component/assets/image-equilibrium-drQxGI4l.jpg"
          alt="Equilibrium NFT artwork featuring an abstract geometric pattern in shades of blue and cyan"
        />
      </figure>
      <article class="card__content flex-col-md">
        <h1 class="card__title">Equilibrium #3429</h1>
        <p class="card__description">
          Our Equilibrium collection promotes balance and calm.
        </p>
        <section class="card__stats" aria-label="NFT statistics">
          <div class="card__price">
            <img
              src="data:image/svg+xml,%3csvg%20width='11'%20height='18'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M11%2010.216%205.5%2018%200%2010.216l5.5%203.263%205.5-3.262ZM5.5%200l5.496%209.169L5.5%2012.43%200%209.17%205.5%200Z'%20fill='%2300FFF8'/%3e%3c/svg%3e"
              alt="Ethereum cryptocurrency icon"
            />
            <p class="card__price-amount">0.041 ETH</p>
          </div>
          <div class="card__days-left">
            <img
              src="data:image/svg+xml,%3csvg%20width='17'%20height='17'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M8.305%202.007a6.667%206.667%200%201%200%200%2013.334%206.667%206.667%200%200%200%200-13.334Zm2.667%207.334H8.305a.667.667%200%200%201-.667-.667V6.007a.667.667%200%200%201%201.334%200v2h2a.667.667%200%200%201%200%201.334Z'%20fill='%238BACD9'/%3e%3c/svg%3e"
              alt="Clock icon indicating time remaining"
            />
            <p class="card__days-left-text">3 days left</p>
          </div>
        </section>
        <hr class="card__divider" />
        <figure class="card__creator">
          <img
            src="/nft-card-component/assets/image-avatar-CtSSaui_.png"
            alt="Avatar of Jules Wyvern, the creator of this NFT"
          />
          <figcaption class="card__creator-text">
            Creation of <span class="card__creator-name">Jules Wyvern</span>
          </figcaption>
        </figure>
      </article>
    </main>

  </body>
</html>
